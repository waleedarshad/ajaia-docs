services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ajaia
      POSTGRES_PASSWORD: ajaia
      POSTGRES_DB: ajaia
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ajaia -d ajaia"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://ajaia:ajaia@db:5432/ajaia?schema=public
      SESSION_SECRET: local-dev-secret-change-in-prod
      DEMO_PASSWORD: demo1234
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
